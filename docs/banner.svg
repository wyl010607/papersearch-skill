<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-label="papersearch-skill banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" rx="16" fill="url(#bg)"/>
  <!-- 放大镜 + 文档图标 -->
  <g transform="translate(52,46)">
    <circle cx="44" cy="44" r="40" fill="none" stroke="#38bdf8" stroke-width="6"/>
    <line x1="74" y1="74" x2="106" y2="106" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <g transform="translate(24,20)">
      <rect width="40" height="50" rx="4" fill="#f8fafc"/>
      <line x1="8" y1="12" x2="32" y2="12" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="24" x2="32" y2="24" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="36" x2="24" y2="36" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <!-- 标题区 -->
  <text x="190" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="40" font-weight="700" fill="#f8fafc">papersearch&#8209;skill</text>
  <rect x="192" y="100" width="330" height="3" rx="1.5" fill="#38bdf8"/>
  <text x="190" y="132" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#94a3b8">学术检索 · 论文下载 · 引用导出 —— 给 Coding Agent 的文献工作台</text>
  <!-- 数据源徽片 -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">
    <rect x="190" y="152" width="58" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="202" y="169" fill="#7dd3fc">arXiv</text>
    <rect x="256" y="152" width="46" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="266" y="169" fill="#7dd3fc">S2</text>
    <rect x="310" y="152" width="76" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="320" y="169" fill="#7dd3fc">OpenAlex</text>
    <rect x="394" y="152" width="118" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="404" y="169" fill="#7dd3fc">GoogleScholar</text>
    <rect x="520" y="152" width="54" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="530" y="169" fill="#7dd3fc">知网</text>
  </g>
  <!-- 右侧装饰：引文符号 -->
  <text x="740" y="96" font-family="Georgia,serif" font-size="88" fill="#1e40af" opacity="0.85">”</text>
  <text x="740" y="160" font-family="Georgia,serif" font-size="88" fill="#1e40af" opacity="0.85" transform="rotate(180 760 130)">”</text>
</svg>
